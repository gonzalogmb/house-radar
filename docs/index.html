<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>House Radar — demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◎</span>
        <div>
          <h1>House Radar</h1>
          <p id="meta-line" class="muted tiny">cargando…</p>
        </div>
      </div>
      <button id="theme-toggle" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema">☾</button>
    </header>

    <section id="kpis" class="kpis"></section>

    <div class="info-banner">
      <span>📸 Instantánea estática, generada una vez al día por GitHub Actions — sin servidor detrás, sin scraping bajo demanda.</span>
      <a href="https://github.com/gonzalogmb/house-radar" target="_blank" rel="noopener">Córrelo tú mismo con la app completa →</a>
    </div>

    <main>
      <div class="toolbar">
        <div class="chips" id="quick-filters">
          <button class="chip" data-quick="all" aria-pressed="true">Todos</button>
          <button class="chip" data-quick="new" aria-pressed="false">✦ Nuevos</button>
          <button class="chip" data-quick="drops" aria-pressed="false">↓ Bajadas</button>
        </div>
        <div class="toolbar-fields">
          <div class="field inline wide">
            <span>Barrio</span>
            <div class="msel" id="f-neighborhood">
              <button type="button" class="msel-trigger">Todos los barrios</button>
              <div class="msel-panel hidden">
                <input type="text" class="msel-search" placeholder="Buscar barrio…" />
                <div class="msel-actions"><button type="button" data-action="clear">Limpiar</button></div>
                <div class="msel-groups"></div>
              </div>
            </div>
          </div>
          <label class="field inline">
            <span>Portal</span>
            <select id="f-portal"><option value="">Todos</option></select>
          </label>
          <label class="field inline">
            <span>Precio máx.</span>
            <input id="f-max-price" type="number" step="10000" placeholder="—" />
          </label>
          <label class="field inline">
            <span>Hab. mín.</span>
            <input id="f-min-rooms" type="number" min="0" max="10" placeholder="—" />
          </label>
          <label class="field inline">
            <span>m² mín.</span>
            <input id="f-min-surface" type="number" step="5" placeholder="—" />
          </label>
          <label class="field inline">
            <span>Orden</span>
            <select id="f-order">
              <option value="first_seen">Novedad</option>
              <option value="price">Precio</option>
              <option value="price_per_m2">€/m²</option>
              <option value="surface_m2">Superficie</option>
            </select>
          </label>
          <button id="sort-dir" class="icon-btn" title="Invertir orden">↓</button>
        </div>
      </div>

      <p id="listings-count" class="muted tiny count-line"></p>
      <div id="listings-grid" class="grid-cards"></div>

      <p class="footnote">
        Datos de Fotocasa y pisos.com, uso personal · código en
        <a href="https://github.com/gonzalogmb/house-radar" target="_blank" rel="noopener">GitHub</a>
      </p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
